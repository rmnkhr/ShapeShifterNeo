<div *ngIf="(this.playbackModel$ | async) as model"
  class="playback"
  fxLayout="row"
  fxLayoutAlign="center center">
  <span fxFlex></span>
  <button class="playback-icon-button"
    mat-icon-button
    matTooltip="Restart"
    matTooltipPosition="below"
    matTooltipShowDelay="500"
    (click)="this.restartClick($event)">
    <mat-icon>motion_photos_on</mat-icon>
  </button>
  <button class="playback-icon-button"
    mat-icon-button
    matTooltip="Rewind (Left)"
    matTooltipPosition="below"
    matTooltipShowDelay="500"
    (click)="this.rewindClick($event)">
    <mat-icon>skip_previous</mat-icon>
  </button>
  <button class="playback-primary-button"
    mat-mini-fab
    matTooltip="{{ (model.isPlaying) ? 'Pause' : 'Play' }} (Spacebar)"
    matTooltipPosition="below"
    matTooltipShowDelay="500"
    (click)="this.playPauseButtonClick($event)">
    <mat-icon>{{ model.isPlaying ? 'pause' : 'play_arrow' }}</mat-icon>
  </button>
  <button class="playback-icon-button"
    mat-icon-button
    matTooltip="Fast forward (Right)"
    matTooltipPosition="below"
    matTooltipShowDelay="500"
    (click)="this.fastForwardClick($event)">
    <mat-icon>skip_next</mat-icon>
  </button>
  <button class="playback-icon-button repeating-button"
    mat-icon-button
    matTooltip="Repeat (R)"
    matTooltipPosition="below"
    matTooltipShowDelay="500"
    (click)="this.isRepeatingClick($event)">
    <mat-icon [class.activated]="model.isRepeating">repeat</mat-icon>
  </button>
  <span fxFlex></span>
</div>
