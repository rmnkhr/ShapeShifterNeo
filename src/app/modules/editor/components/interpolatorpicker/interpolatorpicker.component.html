<div class="ipc-root">
  <!-- Preset trigger + Custom toggle -->
  <div class="ipc-controls">
    <mat-menu #presetMenu="matMenu"
      class="ss-glass-menu">
      <button mat-menu-item
        *ngFor="let interp of INTERPOLATORS"
        [class.is-active]="value === interp.value"
        (click)="onPresetSelect(interp.value)">
        {{ interp.label }}
      </button>
    </mat-menu>
    <button class="ipc-preset-trigger"
      [disabled]="disabled"
      [matMenuTriggerFor]="presetMenu">
      <span class="ipc-preset-label">{{ currentLabel }}</span>
      <mat-icon class="ipc-chevron">expand_more</mat-icon>
    </button>
    <button class="ipc-custom-btn"
      type="button"
      [class.is-active]="showCustomEditor"
      [disabled]="disabled"
      (click)="toggleCustomEditor()"
      matTooltip="Custom cubic-bezier"
      matTooltipPosition="below"
      matTooltipShowDelay="500">
      <mat-icon>timeline</mat-icon>
    </button>
  </div>

  <!-- Custom cubic-bezier editor -->
  <div class="ipc-custom-editor"
    *ngIf="showCustomEditor">

    <!-- SVG canvas — no width/height attrs, CSS makes it responsive -->
    <svg #bezierCanvas
      class="ipc-canvas"
      viewBox="0 0 200 200"
      (pointermove)="onSvgPointerMove($event)"
      (pointerup)="onSvgPointerUp($event)">

      <!-- Highlight the [0,1]×[0,1] bezier region -->
      <rect class="ipc-main-area"
        x="0"
        [attr.y]="GRID_Y1"
        width="200"
        [attr.height]="GRID_Y0 - GRID_Y1" />

      <!-- Grid: vertical lines at 25%, 50%, 75% of x -->
      <g class="ipc-grid">
        <line x1="50"  y1="0" x2="50"  y2="200" />
        <line x1="100" y1="0" x2="100" y2="200" />
        <line x1="150" y1="0" x2="150" y2="200" />
        <!-- Horizontal lines at 25%, 50%, 75% of y within the [0,1] box -->
        <line x1="0" y1="75"  x2="200" y2="75" />
        <line x1="0" y1="100" x2="200" y2="100" />
        <line x1="0" y1="125" x2="200" y2="125" />
        <!-- value=0 and value=1 boundary lines (slightly stronger) -->
        <line class="ipc-grid-boundary" x1="0" [attr.y1]="GRID_Y0" x2="200" [attr.y2]="GRID_Y0" />
        <line class="ipc-grid-boundary" x1="0" [attr.y1]="GRID_Y1" x2="200" [attr.y2]="GRID_Y1" />
      </g>

      <!-- Diagonal guide (0,0)→(1,1) -->
      <line class="ipc-guide"
        x1="0"
        [attr.y1]="GRID_Y0"
        x2="200"
        [attr.y2]="GRID_Y1" />

      <!-- Control-point arm lines -->
      <path class="ipc-handle-line" [attr.d]="line1D" />
      <path class="ipc-handle-line" [attr.d]="line2D" />

      <!-- Bezier curve -->
      <path class="ipc-curve" [attr.d]="bezierCurveD" />

      <!-- Handle 1 (x1,y1) — primary color -->
      <circle class="ipc-handle"
        [attr.cx]="handle1X"
        [attr.cy]="handle1Y"
        r="6"
        (pointerdown)="onHandlePointerDown($event, 1)" />

      <!-- Handle 2 (x2,y2) — secondary color -->
      <circle class="ipc-handle ipc-handle-2"
        [attr.cx]="handle2X"
        [attr.cy]="handle2Y"
        r="6"
        (pointerdown)="onHandlePointerDown($event, 2)" />
    </svg>

    <!-- Number inputs -->
    <div class="ipc-inputs">
      <label class="ipc-input-group">
        <span class="ipc-input-label">x1</span>
        <input class="ipc-input"
          type="number"
          min="0"
          max="1"
          step="0.01"
          [value]="x1"
          [disabled]="disabled"
          (input)="onControlPointInput('x1', $event)">
      </label>
      <label class="ipc-input-group">
        <span class="ipc-input-label">y1</span>
        <input class="ipc-input"
          type="number"
          min="-0.5"
          max="1.5"
          step="0.01"
          [value]="y1"
          [disabled]="disabled"
          (input)="onControlPointInput('y1', $event)">
      </label>
      <label class="ipc-input-group">
        <span class="ipc-input-label">x2</span>
        <input class="ipc-input"
          type="number"
          min="0"
          max="1"
          step="0.01"
          [value]="x2"
          [disabled]="disabled"
          (input)="onControlPointInput('x2', $event)">
      </label>
      <label class="ipc-input-group">
        <span class="ipc-input-label">y2</span>
        <input class="ipc-input"
          type="number"
          min="-0.5"
          max="1.5"
          step="0.01"
          [value]="y2"
          [disabled]="disabled"
          (input)="onControlPointInput('y2', $event)">
      </label>
    </div>

    <!-- Preview dot -->
    <div class="ipc-preview">
      <div class="ipc-preview-track">
        <div class="ipc-preview-dot"
          *ngIf="showPreviewDot"
          [style.animation-timing-function]="cubicBezierCSS">
        </div>
      </div>
    </div>
  </div>
</div>
